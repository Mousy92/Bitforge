name: Deploy to Cloudflare Pages

# Builds the site on GitHub's runners and deploys it to Cloudflare Pages.
# Runs on every push to main (and can be run manually). Because the build and
# upload happen on GitHub's infrastructure, it is not affected by the sandbox
# network proxy that blocks direct uploads from a Claude cloud session.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Show accessible account (debug)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 whoami || true

      - name: Create project if missing, then deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create bitforge --production-branch=main \
            || echo "project create skipped (likely already exists) — continuing"
          npx --yes wrangler@3 pages deploy dist --project-name=bitforge --branch=main
