name: Verify backend

# One-off: POSTs a test build to the live API and reads it back, to confirm the
# KV binding works end-to-end. Safe to delete after.

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Round-trip the save/load API
        run: |
          BASE="https://bitforge-b5w.pages.dev"
          CODE="VERIFY$(date +%s)"
          echo "POST a test build..."
          SAVE=$(curl -s -X POST "$BASE/api/builds" --data "$CODE")
          echo "save response: $SAVE"
          ID=$(echo "$SAVE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$ID" ]; then echo "::error::no id returned — binding likely not active"; exit 1; fi
          echo "got id: $ID"
          echo "GET it back..."
          GET=$(curl -s "$BASE/api/builds/$ID")
          echo "get response: $GET"
          echo "$GET" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('code')=='$CODE', 'mismatch'; print('✅ round-trip OK: stored and retrieved match')"
